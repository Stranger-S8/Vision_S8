[project]
name = "vision-s8"
version = "0.1.0"
description = "AI-Powered Product Image Auditing & Optimization Tool for E-commerce"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Vision_S8" }
]
keywords = [
    "ai", "e-commerce", "product-photography", "image-optimization",
    "gemini", "fastapi", "image-analysis", "seo"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "google-genai>=1.64.0",
    "pillow>=12.1.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.21.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "rembg[cpu]>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
    "gradio>=6.10.0",
]

[project.optional-dependencies]
scraping = ["playwright>=1.49.0"]
ui = ["gradio>=4.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
all = [
    "playwright>=1.49.0",
    "gradio>=4.0.0",
]

[project.scripts]
vision-s8 = "vision_s8.main:run"
vision-s8-ui = "vision_s8.web_ui:run_web_ui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_s8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
